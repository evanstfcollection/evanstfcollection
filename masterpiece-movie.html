<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masterpiece Movie | Evan's TF Collection</title>
  <link rel="icon" type="image/png" href="images/EvansTFCollection-favicon.png">
  <link rel="stylesheet" href="masterpiece-movie.css">
</head>
<body>
<header class="topbar">
  <a class="site-logo" href="index.html"><img src="images/evanstfcollection-logo.png" alt="Evan's TF Collection"></a>
  <nav class="main-nav">
    <a class="nav-item autobots" href="autobots.html"><img src="images/autobots-icon.png" alt=""><span>AUTOBOTS</span></a>
    <a class="nav-item decepticons" href="decepticons.html"><img src="images/decepticons-icon.png" alt=""><span>DECEPTICONS</span></a>
    <a class="nav-item masterpiece active" href="masterpiece-movie.html"><img src="images/masterpiece-movie-icon.png" alt=""><span>MASTERPIECE<br>MOVIE</span></a>
    <a class="nav-item third-party" href="third-party.html"><img src="images/3rd-party-icon.png" alt=""><span>3RD PARTY</span></a>
    <a class="nav-item primes" href="the-primes.html"><img src="images/primes-icon.png" alt=""><span>THE PRIMES</span></a>
    <a class="nav-item contact" href="contact.html"><img src="images/contact-icon.png" alt=""><span>CONTACT</span></a>
  </nav>
</header>
<main>
  <section class="hero"><div class="hero-overlay"></div></section>
  <section class="collection-shell">
    <div class="collection-heading"><h2>MASTERPIECE MOVIE COLLECTION</h2></div>
    <div class="collection-layout">
      <div id="previewGrid" class="preview-grid"></div>

      <aside id="collectionInfo" class="collection-info" aria-label="Selected figure information">
        <button id="infoClose" class="info-close" type="button" aria-label="Close information panel">×</button>

        <div class="info-main">
          <div id="infoImage" class="info-image"></div>
          <div class="info-details">
            <div class="info-title">
              <img src="images/masterpiece-movie-icon.png" alt="">
              <h2 id="infoName">FIGURE NAME</h2>
            </div>
            <div id="infoSpecs" class="info-specs"></div>
          </div>
        </div>

        <div id="infoThumbs" class="info-thumbs"></div>

        <div class="info-notes">
          <h3>Collection Notes:</h3>
          <p id="infoNotes"></p>
        </div>

        <div class="info-navigation">
          <button id="previousFigure" type="button">‹ Previous</button>
          <span id="infoCounter">1 of 1</span>
          <button id="nextFigure" type="button">Next ›</button>
        </div>
      </aside>

      <dialog id="imageLightbox" class="image-lightbox" aria-label="Full-size collection image">
        <button id="closeImageLightbox" class="lightbox-close" type="button" aria-label="Close full-size image">×</button>
        <img id="lightboxImage" src="" alt="">
      </dialog>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="masterpiece-movie.js"></script>
</body>
</html>
