<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 500"
     preserveAspectRatio="none">
  <defs>
    <filter id="weatheredGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="roughen">
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".018"
        numOctaves="2"
        seed="7"
        result="noise"/>
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="1.6"
        xChannelSelector="R"
        yChannelSelector="G"/>
    </filter>

    <mask id="wornMask">
      <rect width="1200" height="500" fill="white"/>
      <g fill="black" opacity=".34">
        <path d="M42 92 L70 63 L82 71 L55 101 Z"/>
        <path d="M1118 74 L1150 101 L1137 116 L1108 89 Z"/>
        <path d="M78 393 L105 421 L91 437 L65 408 Z"/>
        <path d="M1096 414 L1125 389 L1140 404 L1110 435 Z"/>
        <rect x="288" y="27" width="45" height="5" rx="2"/>
        <rect x="715" y="466" width="61" height="5" rx="2"/>
        <rect x="29" y="178" width="4" height="32"/>
        <rect x="1167" y="305" width="4" height="29"/>
      </g>
    </mask>
  </defs>

  <g fill="none"
     stroke="white"
     stroke-linecap="square"
     stroke-linejoin="miter"
     filter="url(#weatheredGlow)"
     mask="url(#wornMask)">

    <path stroke-width="5"
      d="M30 92 L92 30 H1108 L1170 92 V408 L1108 470 H92 L30 408 Z"/>

    <path stroke-width="2.5"
      d="M48 105 L105 48 H1095 L1152 105 V395 L1095 452 H105 L48 395 Z"/>

    <path stroke-width="4"
      d="M92 30 H250 L278 58 H365"/>
    <path stroke-width="2"
      d="M112 48 H224 L244 68 H320"/>
    <path stroke-width="3"
      d="M70 92 L112 50 L150 50"/>
    <path stroke-width="2"
      d="M130 78 H205 L224 59"/>

    <path stroke-width="4"
      d="M935 58 H922 L950 30 H1108"/>
    <path stroke-width="2"
      d="M880 68 H956 L976 48 H1088"/>
    <path stroke-width="3"
      d="M1050 50 H1090 L1130 90"/>
    <path stroke-width="2"
      d="M995 78 H1070"/>

    <path stroke-width="4"
      d="M92 470 H250 L278 442 H365"/>
    <path stroke-width="2"
      d="M112 452 H224 L244 432 H320"/>
    <path stroke-width="3"
      d="M70 408 L112 450 L150 450"/>
    <path stroke-width="2"
      d="M130 422 H205 L224 441"/>

    <path stroke-width="4"
      d="M935 442 H922 L950 470 H1108"/>
    <path stroke-width="2"
      d="M880 432 H956 L976 452 H1088"/>
    <path stroke-width="3"
      d="M1050 450 H1090 L1130 410"/>
    <path stroke-width="2"
      d="M995 422 H1070"/>

    <path stroke-width="3" d="M380 30 H530 M670 30 H820"/>
    <path stroke-width="2" d="M400 48 H520 M680 48 H800"/>
    <path stroke-width="3" d="M380 470 H530 M670 470 H820"/>
    <path stroke-width="2" d="M400 452 H520 M680 452 H800"/>

    <path stroke-width="3" d="M30 150 V235 M30 265 V350"/>
    <path stroke-width="2" d="M48 165 V225 M48 275 V335"/>
    <path stroke-width="3" d="M1170 150 V235 M1170 265 V350"/>
    <path stroke-width="2" d="M1152 165 V225 M1152 275 V335"/>

    <path stroke-width="2" d="M250 30 V18 H340 V30"/>
    <path stroke-width="2" d="M860 30 V18 H950 V30"/>
    <path stroke-width="2" d="M250 470 V482 H340 V470"/>
    <path stroke-width="2" d="M860 470 V482 H950 V470"/>

    <path stroke-width="2" d="M30 250 H18 V300 H30"/>
    <path stroke-width="2" d="M1170 250 H1182 V300 H1170"/>

    <rect x="214" y="20" width="22" height="10" stroke-width="2"/>
    <rect x="964" y="20" width="22" height="10" stroke-width="2"/>
    <rect x="214" y="470" width="22" height="10" stroke-width="2"/>
    <rect x="964" y="470" width="22" height="10" stroke-width="2"/>

    <rect x="20" y="214" width="10" height="22" stroke-width="2"/>
    <rect x="1170" y="214" width="10" height="22" stroke-width="2"/>
    <rect x="20" y="264" width="10" height="22" stroke-width="2"/>
    <rect x="1170" y="264" width="10" height="22" stroke-width="2"/>

    <!-- Additional tiny scars / interruptions -->
    <path stroke-width="1.5" d="M155 31 L174 31 M185 31 L197 31"/>
    <path stroke-width="1.5" d="M1008 469 L1024 469 M1034 469 L1052 469"/>
    <path stroke-width="1.5" d="M31 120 L31 137 M1169 363 L1169 380"/>
  </g>

  <!-- Very subtle metallic scratches that sit inside the mechanical frame -->
  <g fill="none" stroke="#ffffff" opacity=".16" stroke-linecap="square">
    <path stroke-width="1" d="M112 91 L151 52 M1048 449 L1084 413"/>
    <path stroke-width="1" d="M277 59 L301 83 M899 417 L924 442"/>
    <path stroke-width="1" d="M53 335 L67 349 M1134 151 L1148 165"/>
  </g>
</svg>
