<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3rd Party | Evan's TF Collection</title>
  <link rel="icon" type="image/png" href="images/EvansTFCollection-favicon.png">
  <link rel="stylesheet" href="third-party.css">
</head>
<body data-category="3rd Party">
<header class="topbar">
  <a class="site-logo" href="index.html"><img src="images/evanstfcollection-logo.png" alt="Evan's TF Collection"></a>
  <nav class="main-nav" aria-label="Main navigation">
    <a class="nav-item autobots" href="autobots.html"><img src="images/autobots-icon.png" alt=""><span>AUTOBOTS</span></a>
    <a class="nav-item decepticons" href="decepticons.html"><img src="images/decepticons-icon.png" alt=""><span>DECEPTICONS</span></a>
    <a class="nav-item masterpiece" href="masterpiece-movie.html"><img src="images/masterpiece-movie-icon.png" alt=""><span>MASTERPIECE<br>MOVIE</span></a>
    <a class="nav-item third-party active" href="third-party.html"><img src="images/3rd-party-icon.png" alt=""><span>3RD PARTY</span></a>
    <a class="nav-item primes" href="the-primes.html"><img src="images/primes-icon.png" alt=""><span>THE PRIMES</span></a>
    <a class="nav-item contact" href="contact.html"><img src="images/contact-icon.png" alt=""><span>CONTACT</span></a>
  </nav>
</header>
<main>
  <section class="hero"></section>
  <section class="collection-shell">
    <div class="collection-heading"><h2>3RD PARTY COLLECTION</h2></div>
    <div class="collection-layout">
      <div class="preview-grid"></div>
      <aside class="collection-info" aria-label="Selected figure information">
        <button class="info-close" type="button" aria-label="Close information panel">×</button>
        <div class="info-main">
          <div class="info-image"><span>FIGURE PREVIEW</span></div>
          <div class="info-details">
            <div class="info-title">
              <img src="images/3rd-party-icon.png" alt="">
              <h2>FIGURE NAME</h2>
            </div>
            <div class="info-specs">
              <div><strong>Manufacturer:</strong><span>—</span></div>
              <div><strong>Toy Line:</strong><span>—</span></div>
              <div><strong>Series:</strong><span>—</span></div>
              <div><strong>Movie Reference:</strong><span>—</span></div>
              <div><strong>Release Year:</strong><span>—</span></div>
              <div><strong>Alternate Mode:</strong><span>—</span></div>
              <div><strong>Scale:</strong><span>—</span></div>
              <div><strong>Condition:</strong><span>—</span></div>
            </div>
          </div>
        </div>
        <div class="info-thumbs"></div>
        <div class="info-notes"><h3>Collection Notes:</h3><p>Loading collection data...</p></div>
        <div class="info-navigation">
          <button type="button">‹ Previous</button>
          <span>1 of 0</span>
          <button type="button">Next ›</button>
        </div>
      </aside>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="gallery.js"></script>
</body>
</html>
