<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autobots | Evan's TF Collection</title>
  <link rel="icon" type="image/png" href="images/EvansTFCollection-favicon.png">
  <link rel="stylesheet" href="autobots.css">
</head>
<body>
  <header class="topbar">
    <a class="site-logo" href="index.html">
      <img src="images/evanstfcollection-logo.png" alt="Evan's TF Collection">
    </a>

    <nav class="main-nav">
      <a class="nav-item cyber-nav autobots active" href="autobots.html">
        <img src="images/autobots-icon.png" alt=""> <span>AUTOBOTS</span>
      </a>
      <a class="nav-item cyber-nav decepticons" href="decepticons.html">
        <img src="images/decepticons-icon.png" alt=""> <span>DECEPTICONS</span>
      </a>
      <a class="nav-item cyber-nav masterpiece" href="masterpiece-movie.html">
        <img src="images/masterpiece-movie-icon.png" alt=""> <span>MASTERPIECE<br>MOVIE</span>
      </a>
      <a class="nav-item cyber-nav third-party" href="third-party.html">
        <img src="images/3rd-party-icon.png" alt=""> <span>3RD PARTY</span>
      </a>
      <a class="nav-item cyber-nav primes" href="the-primes.html">
        <img src="images/primes-icon.png" alt=""> <span>THE PRIMES</span>
      </a>
      <a class="nav-item cyber-nav contact" href="contact.html">
        <img src="images/contact-icon.png" alt=""> <span>CONTACT</span>
      </a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-overlay"></div>
      <div class="hero-copy">
        <img class="hero-faction-icon" src="images/autobots-icon.png" alt="Autobot insignia">
        <h1>AUTOBOTS</h1>
        <p>Freedom. Courage. Unity.</p>
      </div>
    </section>

    <section class="collection-shell">
      <div class="collection-heading">
        <h2>AUTOBOT COLLECTION</h2>
        <div class="filters">
          <label class="search">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="Search figures...">
          </label>
          <select id="manufacturerFilter">
            <option value="">All Manufacturers</option>
          </select>
          <select id="seriesFilter">
            <option value="">All Series</option>
          </select>
          <select id="yearFilter">
            <option value="">All Years</option>
          </select>
          <button id="clearFilters">Clear</button>
        </div>
      </div>

      <div class="content-layout">
        <div id="gallery" class="gallery"></div>

        <aside id="detailPanel" class="detail-panel" aria-hidden="true">
          <button id="closeDetails" class="close-details" aria-label="Close details">×</button>
          <div class="detail-top">
            <div id="detailMainImage" class="detail-main-image"></div>
            <div class="detail-info">
              <div class="detail-title">
                <img src="images/autobots-icon.png" alt="">
                <h2 id="detailName">OPTIMUS PRIME</h2>
              </div>
              <div id="detailSpecs" class="detail-specs"></div>
            </div>
          </div>
          <div id="detailThumbs" class="detail-thumbs"></div>
          <div class="notes">
            <h3>Collection Notes:</h3>
            <p id="detailNotes"></p>
          </div>
          <div class="detail-navigation">
            <button id="previousFigure">‹ Previous</button>
            <span id="detailCounter">1 of 1</span>
            <button id="nextFigure">Next ›</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="autobots.js"></script>
</body>
</html>
