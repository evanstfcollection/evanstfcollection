<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TF Collection Admin</title><link rel="icon" href="images/EvansTFCollection-favicon.png"><link rel="stylesheet" href="admin.css"></head><body><main class="shell"><header><img src="images/evanstfcollection-logo.png" alt="Evan's TF Collection"><div><h1>COLLECTION DATABASE</h1><p>Add a figure profile and its photographs.</p></div></header><section id="login" class="panel"><h2>ADMIN LOGIN</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">SIGN IN</button><p id="loginStatus"></p></section><section id="editor" class="panel" hidden><div class="title"><h2>ADD FIGURE</h2><button id="logoutBtn">SIGN OUT</button></div><form id="form"><div class="grid"><label>Category<select id="category" required><option value="">Choose...</option><option>Autobots</option><option>Decepticons</option><option>Masterpiece Movie</option><option>3rd Party</option><option>The Primes</option></select></label><label>Figure Name<input id="name" required></label><label>Manufacturer<input id="manufacturer"></label><label>Toy Line<input id="toyLine"></label><label>Series / Model<input id="series"></label><label>Movie Reference<select id="movieReference"><option value="">Choose...</option><option>Transformers - The Movie (1986)</option><option>Transformers (2007)</option><option>Transformers - Revenge of the Fallen (2009)</option><option>Transformers: Dark of the Moon (2011)</option><option>Transformers: Age of Extinction (2014)</option><option>Transformers: The Last Knight (2017)</option><option>Transformers: Rise of the Beasts (2023)</option><option>Transformers: One (2024)</option></select></label><label>Year Released<input id="year" type="number"></label><label>Alternate Mode<input id="alternate"></label><label>Scale<input id="scale"></label><label>Condition<input id="condition"></label></div><label>Collection Notes<textarea id="notes" rows="5"></textarea></label><label class="upload">Figure Images<input id="images" type="file" accept="image/*" multiple><small>First image becomes the main preview.</small></label><label class="check"><input id="published" type="checkbox" checked> Publish this figure</label><button id="save" type="submit">SAVE FIGURE + IMAGES</button><p id="saveStatus"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
